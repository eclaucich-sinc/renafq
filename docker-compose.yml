services:
  mongodb:
    # MONGO_IMAGE (opcional, en .env) permite fijar otra versión si el CPU del
    # host no soporta AVX (requisito de Mongo 5.0+) — en ese caso usar "mongo:4.4".
    image: ${MONGO_IMAGE:-mongo:6.0}
    restart: unless-stopped
    environment:
      # Valores reales van en un .env (no commiteado) en la raíz del proyecto — ver .env.example
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      # Bindea solo a esta IP del host — 127.0.0.1 por default (nadie afuera de la
      # máquina puede conectarse). Para exponerlo a otras apps por VPN, poner en
      # .env la IP de la interfaz VPN de esta máquina, ej: MONGO_BIND_IP=10.8.0.1
      # MONGO_HOST_PORT (opcional) permite usar otro puerto si el 27017 ya está
      # ocupado en esa máquina (por ejemplo, por otro Mongo preexistente).
      - "${MONGO_BIND_IP:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container: