services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      # Valores reales van en un .env (no commiteado) en la raíz del proyecto — ver .env.example
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      # Solo accesible desde esta misma máquina por default.
      # En el servidor, para exponerlo a otras apps por VPN, cambiar a "<ip-vpn-servidor>:27017:27017".
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container: