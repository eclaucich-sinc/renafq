services:
  mongodb:
    # MONGO_IMAGE (opcional, en .env) permite fijar otra versión si el CPU del
    # host no soporta AVX (requisito de Mongo 5.0+) — en ese caso usar "mongo:4.4".
    image: ${MONGO_IMAGE:-mongo:6.0}
    restart: unless-stopped
    environment:
      # Valores reales van en un .env (no commiteado) en la raíz del proyecto — ver .env.example
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      # Solo accesible desde esta misma máquina por default.
      # MONGO_HOST_PORT (opcional, en .env) permite usar otro puerto si el 27017
      # ya está ocupado en esa máquina (por ejemplo, por otro Mongo preexistente).
      # En el servidor, para exponerlo a otras apps por VPN, cambiar a "<ip-vpn-servidor>:<puerto>:27017".
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data_container:/data/db

volumes:
  mongodb_data_container: